# The values helm lint and kubeconform use for the bundled PostgreSQL (the default database). Not used for an install.
existingSecret:
  name: remedy-secrets
postgres:
  existingSecret: remedy-postgres
  persistence:
    storageClass: local-path
cluster:
  enabled: true
  write:
    enabled: true
    namespaces: [demo]
networkPolicy:
  apiServer:
    cidrs: [172.18.0.2/32]
