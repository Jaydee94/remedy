# The values helm lint and kubeconform need to render the chart. Not used for an install.
existingSecret:
  name: remedy-secrets
database:
  existingSecret: remedy-database
cluster:
  enabled: true
  write:
    enabled: true
    namespaces: [demo]
networkPolicy:
  public:
    from:
      - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
  apiServer:
    cidrs: [172.18.0.2/32]
  hosts:
    - {cidr: 192.0.2.10/32, port: 22}
    - {cidr: "fd00::1/128", port: 22}
  alertmanager:
    namespace: monitoring
    podSelector: {app.kubernetes.io/name: vmalertmanager}
    port: 9093
  database:
    namespace: databases
    podSelector: {cnpg.io/cluster: remedy}
    port: 5432
