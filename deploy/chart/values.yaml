# Remedy. The chart runs the control plane (a Deployment) and the runner (a StatefulSet) in the release's namespace.
# It supports one release per namespace: the resource names are fixed (remedy-server, remedy-runner, ...).
#
# Nothing here is a secret. The admin password, the runner token and the master key come from a Secret that exists
# already (existingSecret), for example one a SealedSecret creates. So do the password of the bundled PostgreSQL
# (postgres.existingSecret) and the connection URL of a database of your own (database.existingSecret).

image:
  pullPolicy: IfNotPresent
  server:
    repository: ghcr.io/jaydee94/remedy-server
    tag: ""            # empty: the chart's appVersion
  runner:
    repository: ghcr.io/jaydee94/remedy-runner
    tag: ""

existingSecret:
  name: ""             # required
  keys:
    adminPassword: admin-password   # 12 or more characters
    runnerToken: runner-token       # 24 or more characters
    masterKey: master-key           # openssl rand -base64 32; losing it loses the sealed GitHub token

# The control plane's database is a PostgreSQL. By default the chart installs a small single-node one of its own (postgres,
# below). To use a database of your own instead (an operator, a server on another host), set database.existingSecret: then
# nothing of the bundled one is rendered, and networkPolicy.database is required while the policies are on. The control plane
# itself keeps no state on a volume.
database:
  # Empty: the bundled PostgreSQL. Set: the name of a Secret that exists already and holds the connection URL, a libpq-style URL with the password
  # in it, for example postgres://remedy:PASSWORD@db.databases.svc:5432/remedy?sslmode=require
  # (sslmode and the like travel in the URL). The chart cannot mount a CA file, so sslrootcert=/path has nothing to read: verify-full
  # works only with a CA the server image already trusts; for a private CA use require (encrypted, not verified). The chart never creates the Secret and refuses the URL as a
  # value: a key named url, password or anything else under database is an error. The URL reaches the pod as
  # REMEDY_DATABASE_URL (secretKeyRef); the pool size is REMEDY_DATABASE_MAX_CONNS (default 10, 2 to 100) in server.env.
  existingSecret: ""
  secretKey: url       # the key of that Secret that holds the URL

# The bundled PostgreSQL: a StatefulSet remedy-postgres with one pod and one claim, user and database remedy, in the release
# namespace. No high availability, no replication, no TLS (the control plane connects with sslmode=disable on the pod
# network), no backups off the node. See the chart README, "The database".
postgres:
  # Unset (the default): on, unless database.existingSecret is set. true together with database.existingSecret is refused
  # (a contradiction), and so is false without it (no database at all).
  enabled: null
  # Required while the bundled database is on: a Secret that exists already, with the password under passwordKey. The chart
  # never creates it and never takes the password as a value. The password must be URL-safe (the control plane's URL is
  # composed with it), for example openssl rand -hex 24. It is set when the data directory is created; changing it in the
  # Secret later does not change it in the database.
  existingSecret: ""
  passwordKey: password
  image:
    repository: postgres
    tag: "16.15"       # an exact minor version; a new minor of the same major is a plain upgrade, a new major needs a dump and restore
  persistence:
    size: 5Gi
    storageClass: ""   # empty: the cluster's default
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  # A CronJob that runs pg_dump into a claim of its own and keeps the dumps of the last retentionDays days. The claim is in
  # the same cluster (on a single-node cluster on the same disk): it protects against a damaged database, not a lost disk.
  backup:
    enabled: true
    schedule: "17 3 * * *"
    retentionDays: 7
    size: 2Gi
    storageClass: ""   # empty: postgres.persistence.storageClass
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 256Mi}

server:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  service:
    type: ClusterIP
    nodePort: null     # only for type NodePort
  # Extra environment variables for the control plane, for example REMEDY_POLL_INTERVAL or REMEDY_LOG_LEVEL. A name that
  # contains PASSWORD, TOKEN or KEY is refused: secrets do not belong in values. REMEDY_DATABASE_URL and REMEDY_DB are
  # refused too (the chart sets the first from the Secret of database; the second is gone). REMEDY_DATABASE_MAX_CONNS is
  # allowed here. REMEDY_POLL_INTERVAL, REMEDY_DIAGNOSE_* and REMEDY_RUN_TIMEOUT are only defaults: the Setup page can
  # override them.
  env: {}

ingress:
  enabled: false
  className: ""
  host: ""             # required when enabled
  annotations: {}      # nginx: nginx.ingress.kubernetes.io/proxy-buffering: "off" keeps the live streams live
  tls:
    secretName: ""     # empty: no TLS block (then the cookie is not Secure, see the runbook)

runner:
  enabled: true
  model: ""            # REMEDY_CLAUDE_MODEL; the CLI runs with --restricted, which ignores user settings: pin it
  runTimeout: ""       # REMEDY_RUN_TIMEOUT, for example 10m. The control plane gets it too, as the default of the Setup page's setting
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  persistence:
    size: 1Gi
    storageClass: ""
    existingClaim: ""  # set: use this claim for the login and the CLI's state, create none
  # The init container installs this CLI before the runner starts. No image contains it.
  cli:
    version: ""        # required, pinned
    urlTemplate: ""    # required: an https URL with {version} and {platform}
    archive: none      # none, or tar.gz with member the file to take out of it
    member: ""
    platforms:         # the vendor's name for the platform and the SHA-256 of its artifact, per architecture
      amd64: {name: "", sha256: ""}
      arm64: {name: "", sha256: ""}

cluster:
  enabled: false       # the control plane reads the cluster; it runs as the read account (needs networkPolicy.apiServer.cidrs)
  api: https://kubernetes.default.svc
  argoNamespace: argocd   # where Argo CD keeps its Application objects
  write:
    enabled: false     # approved actions: restart a workload, delete a pod, refresh and sync an Argo CD application
    namespaces: []     # where actions may be used; only the default of the allowlist: a value set on the Setup page wins (the cluster RBAC still bounds it). Never the release namespace: Remedy may read itself, never change itself
    tokenRefresh:
      schedule: "*/30 * * * *"   # the write token is minted again this often ...
      lifetime: 2h                # ... and is valid this long, so a stopped job leaves at most this much

networkPolicy:
  enabled: true
  dnsNamespace: kube-system
  # Who may reach the public port (8080). The default is where k3s's Traefik runs. The list must not be empty: in a
  # NetworkPolicy an empty list means every source, so the render fails instead.
  public:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
  # The address and port behind kubernetes.default.svc, as the cluster shows them (kubectl get endpoints kubernetes).
  # Required when cluster.enabled is true. The rule is by endpoint address and port (6443 on k3s and kind), not by the
  # service address. The runner's egress to the public range is 443 only, which keeps it from an API server on 6443 by
  # port; an API server on 443 with a public address is not protected by the except list. To let a pod reach a pod in
  # the cluster use a pod or namespace selector: pod addresses are in 10.0.0.0/8, which the runner's rule excepts.
  apiServer:
    cidrs: []
    port: 6443
  # PostgreSQL, the control plane's egress to its database: one rule on the remedy-server policy (the runner and the token
  # refresher never get it). With the bundled PostgreSQL the chart writes that rule itself and this value must stay empty;
  # with database.existingSecret it is REQUIRED while networkPolicy.enabled is true, in exactly one of two forms.
  # Pods inside the cluster (an operator such as CloudNativePG, or a StatefulSet): TCP to the pods that match podSelector
  # in namespace, like the Alertmanager. An empty podSelector is refused (it would admit every pod of the namespace).
  #   database: {namespace: databases, podSelector: {cnpg.io/cluster: remedy}, port: 5432}
  # An external server: one address range and TCP to it. An IPv4 range must be /16 to /32 and start at its network
  # address (no host bits), an IPv6 range must be /16 to /128 and lie outside ::/16; 0.0.0.0/0, ::/0 and the like are
  # refused, because they would open everything. Name the server by a single address when you can (/32, /128).
  #   database: {cidr: 192.168.178.20/32, port: 5432}
  # port defaults to 5432 in both forms (an integer from 1 to 65535).
  database: {}
  # Where the control plane may open SSH connections (the host tools): single addresses, never a range. Each entry is
  # one egress rule on the remedy-server policy; the runner has no such rule. The render refuses an IPv4 address that
  # is not /32, an IPv6 address that is not /128, a port outside 1 to 65535, and the API server's own address.
  hosts: []
  #  - {cidr: 192.168.178.118/32, port: 22}
  # An Alertmanager inside the cluster, one rule on the remedy-server policy: TCP to the pods that match podSelector in
  # the namespace. Empty: no rule. namespace and a non-empty podSelector are required (an empty selector would admit
  # every pod of the namespace); port defaults to 9093.
  alertmanager: {}
  #  namespace: monitoring
  #  podSelector: {app.kubernetes.io/name: vmalertmanager}
  #  port: 9093
  # A Prometheus-compatible query API inside the cluster (the metrics tools), the same shape and one more rule on the
  # remedy-server policy. Empty: no rule. Unlike the Alertmanager the port is required: Prometheus serves 9090,
  # VictoriaMetrics 8428, and a wrong default would only show as a timeout. The address itself (setting metrics_url,
  # or REMEDY_METRICS_URL) and the Alertmanager interval (REMEDY_ALERTMANAGER_POLL_INTERVAL) need no chart value:
  # server.env passes any REMEDY_* name above, so set them there or on the Setup page.
  metrics: {}
  #  namespace: monitoring
  #  podSelector: {app.kubernetes.io/name: vmsingle}
  #  port: 8428
