{{- if .Values.networkPolicy.enabled }}
{{- if not (.Values.networkPolicy.public | default dict).from }}
{{- fail "networkPolicy.public.from must list at least one peer: an empty list in a NetworkPolicy allows every source, which would open the public port to everyone. Name the Ingress controller's namespace or pod, or an ipBlock." }}
{{- end }}
# The control plane. Ingress: the public port from the configured peers (the Ingress controller, the node), the
# internal port from runner pods only. Egress: DNS, the Kubernetes API when the cluster is on, PostgreSQL
# (networkPolicy.database), the typed extras (hosts, Alertmanager, metrics) and HTTPS to the internet (GitHub), never to a
# private range.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remedy-server
  labels:
    {{- include "remedy.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      {{- include "remedy.selector" (dict "ctx" . "component" "server") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.public.from | nindent 8 }}
      ports:
        - {protocol: TCP, port: 8080}
    - from:
        - podSelector:
            matchLabels:
              {{- include "remedy.selector" (dict "ctx" . "component" "runner") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8081}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- if .Values.cluster.enabled }}
    {{- if not .Values.networkPolicy.apiServer.cidrs }}
    {{- fail "networkPolicy.apiServer.cidrs is required when cluster.enabled is true: the address behind kubernetes.default.svc (kubectl get endpoints kubernetes)" }}
    {{- end }}
    - to:
        {{- range .Values.networkPolicy.apiServer.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.networkPolicy.apiServer.port }}}
    {{- end }}
    {{- /* PostgreSQL: the bundled one (its pods in this namespace), or networkPolicy.database for a database of your own (the
           pods of the cluster or an external range); one rule either way, validated in validate.yaml. */ -}}
    {{- if include "remedy.bundledPostgres" . }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "remedy.postgresSelector" (dict "ctx" . "name" "remedy-postgres") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
    {{- end }}
    {{- with .Values.networkPolicy.database }}
    - to:
        {{- if .cidr }}
        - ipBlock:
            cidr: {{ .cidr }}
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .podSelector | nindent 14 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ if hasKey . "port" }}{{ int64 .port }}{{ else }}5432{{ end }}}
    {{- end }}
    {{- /* networkPolicy.hosts: one rule per single address (SSH for the host tools); networkPolicy.alertmanager and networkPolicy.metrics: one pod selection each. All validated in validate.yaml. */ -}}
    {{- range .Values.networkPolicy.hosts }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
      ports:
        - {protocol: TCP, port: {{ int64 .port }}}
    {{- end }}
    {{- with .Values.networkPolicy.alertmanager }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .podSelector | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ if hasKey . "port" }}{{ int64 .port }}{{ else }}9093{{ end }}}
    {{- end }}
    {{- with .Values.networkPolicy.metrics }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .podSelector | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ int64 .port }}}
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- include "remedy.privateRanges" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: 443}
{{- if .Values.runner.enabled }}
---
# The runner. It takes no connection. It dials the control plane's internal port, resolves names, and reaches the
# internet on 443 (the CLI talks to its vendor); it cannot reach the Kubernetes API or any private range.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remedy-runner
  labels:
    {{- include "remedy.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
spec:
  podSelector:
    matchLabels:
      {{- include "remedy.selector" (dict "ctx" . "component" "runner") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              {{- include "remedy.selector" (dict "ctx" . "component" "server") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 8081}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              {{- include "remedy.privateRanges" . | nindent 14 }}
      ports:
        - {protocol: TCP, port: 443}
{{- end }}
{{- if include "remedy.bundledPostgres" . }}
---
# The bundled PostgreSQL. Ingress on 5432 from two peers of this namespace only: the control plane and the backup job.
# Egress: none at all; the database opens no connection (its probes run inside the container).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remedy-postgres
  labels:
    {{- include "remedy.postgresLabels" (dict "ctx" . "name" "remedy-postgres") | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  podSelector:
    matchLabels:
      {{- include "remedy.postgresSelector" (dict "ctx" . "name" "remedy-postgres") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "remedy.selector" (dict "ctx" . "component" "server") | nindent 14 }}
        - podSelector:
            matchLabels:
              {{- include "remedy.postgresSelector" (dict "ctx" . "name" "remedy-postgres-backup") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
{{- if .Values.postgres.backup.enabled }}
---
# The backup job of the bundled PostgreSQL. It takes no connection; it resolves the database's name and reaches its pods on
# 5432, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remedy-postgres-backup
  labels:
    {{- include "remedy.postgresLabels" (dict "ctx" . "name" "remedy-postgres-backup") | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  podSelector:
    matchLabels:
      {{- include "remedy.postgresSelector" (dict "ctx" . "name" "remedy-postgres-backup") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              {{- include "remedy.postgresSelector" (dict "ctx" . "name" "remedy-postgres") | nindent 14 }}
      ports:
        - {protocol: TCP, port: 5432}
{{- end }}
{{- end }}
{{- if .Values.cluster.write.enabled }}
---
# The token refresher (the CronJob and the hook): DNS and the Kubernetes API, nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: remedy-token-refresher
  labels:
    {{- include "remedy.labels" . | nindent 4 }}
    app.kubernetes.io/component: token-refresh
spec:
  podSelector:
    matchLabels:
      {{- include "remedy.selector" (dict "ctx" . "component" "token-refresh") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        {{- range .Values.networkPolicy.apiServer.cidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.networkPolicy.apiServer.port }}}
{{- end }}
{{- end }}
