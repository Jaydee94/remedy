apiVersion: apps/v1
kind: Deployment
metadata:
  name: remedy-server
  labels:
    {{- include "remedy.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: 1
  # One control plane at a time. The database would allow two, but admin sessions and the signal state are in memory and
  # two pollers would do the same work twice: the old pod is gone before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "remedy.selector" (dict "ctx" . "component" "server") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "remedy.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "remedy.serverAccount" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Still needed without a data volume: it makes the token files of cluster-read and cluster-write readable for 65532.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "remedy.serverImage" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: internal, containerPort: 8081}
          env:
            - {name: REMEDY_ADDR, value: ":8080"}
            - {name: REMEDY_INTERNAL_ADDR, value: ":8081"}
            {{- if include "remedy.bundledPostgres" . }}
            # The bundled PostgreSQL: the password comes from its Secret, and the URL is composed from it. Kubernetes expands
            # $(REMEDY_POSTGRES_PASSWORD) only from an entry above this one, so the order matters. The password must be URL-safe.
            # sslmode=disable: the bundled server has no TLS, and the traffic stays on the pod network inside the namespace.
            - name: REMEDY_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "remedy.postgresSecret" . }}
                  key: {{ include "remedy.postgresSecretKey" . }}
            - name: REMEDY_DATABASE_URL
              value: "postgres://remedy:$(REMEDY_POSTGRES_PASSWORD)@{{ include "remedy.postgresHost" . }}:5432/remedy?sslmode=disable"
            {{- else }}
            # The connection URL holds the database password: it comes from a Secret, never from values.
            - name: REMEDY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "remedy.databaseSecret" . }}
                  key: {{ include "remedy.databaseSecretKey" . }}
            {{- end }}
            - name: REMEDY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "remedy.secretName" . }}
                  key: {{ .Values.existingSecret.keys.adminPassword }}
            - name: REMEDY_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "remedy.secretName" . }}
                  key: {{ .Values.existingSecret.keys.runnerToken }}
            - name: REMEDY_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "remedy.secretName" . }}
                  key: {{ .Values.existingSecret.keys.masterKey }}
            {{- if .Values.cluster.enabled }}
            - {name: REMEDY_K8S_API, value: {{ .Values.cluster.api | quote }}}
            - {name: REMEDY_K8S_READ_TOKEN_FILE, value: /var/run/remedy/read/token}
            - {name: REMEDY_K8S_CA_FILE, value: /var/run/remedy/read/ca.crt}
            - {name: REMEDY_K8S_ARGO_NAMESPACE, value: {{ .Values.cluster.argoNamespace | quote }}}
            {{- end }}
            {{- if .Values.cluster.write.enabled }}
            - {name: REMEDY_K8S_WRITE_TOKEN_FILE, value: /var/run/remedy/write/token}
            - {name: REMEDY_K8S_WRITE_NAMESPACES, value: {{ join "," .Values.cluster.write.namespaces | quote }}}
            {{- end }}
            {{- if and .Values.runner.runTimeout (not (hasKey .Values.server.env "REMEDY_RUN_TIMEOUT")) }}
            - {name: REMEDY_RUN_TIMEOUT, value: {{ .Values.runner.runTimeout | quote }}}
            {{- end }}
            {{- range $name, $value := .Values.server.env }}
            {{- if regexMatch "PASSWORD|TOKEN|KEY" $name }}
            {{- fail (printf "server.env.%s: a name that contains PASSWORD, TOKEN or KEY is refused; secrets belong in the existing Secret, not in values" $name) }}
            {{- end }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.cluster.enabled }}
            - {name: cluster-read, mountPath: /var/run/remedy/read, readOnly: true}
            {{- end }}
            {{- if .Values.cluster.write.enabled }}
            # A directory mount, never subPath: the kubelet does not update a subPath, and the token is replaced.
            - {name: cluster-write, mountPath: /var/run/remedy/write, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.cluster.enabled }}
        # The read identity: the pod's own account token, renewed by the kubelet, and the cluster's CA.
        - name: cluster-read
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - {key: ca.crt, path: ca.crt}
        {{- end }}
        {{- if .Values.cluster.write.enabled }}
        # The write identity: filled by the refresher after the first start, so the Secret is optional.
        - name: cluster-write
          secret:
            secretName: remedy-write-token
            optional: true
        {{- end }}
