name: release

# On every push to main: semantic-release says whether the commits make a release (plan); both images are built and pushed
# (sha-<short>, edge, and X.Y.Z when there is a release); the chart is packaged and pushed as an OCI artifact; and only
# when both are done does semantic-release write the version, tag it and make the GitHub release (publish). A failure in
# between leaves unused X.Y.Z artifacts, never a release without artifacts. See docs/specs/2026-10-09-release-automation-design.md.
#
#   plan --> images --------> publish   (publish only when plan found a version)
#     \                         ^
#      `--> chart (if version) -'
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    # contents: write only because semantic-release checks push access with a dry-run push even in a dry run.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: release/.nvmrc
          cache: npm
          cache-dependency-path: release/package-lock.json
      - run: npm ci --ignore-scripts --prefix release
      - id: next
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: plan
        run: |
          rm -f .release-version
          release/node_modules/.bin/semantic-release --dry-run --extends ./release/release.config.js
          version=$(cat .release-version 2> /dev/null || true)
          # The version ends up in image tags and file names: only X.Y.Z (or nothing) may leave this job.
          re='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [ -n "$version" ] && ! [[ $version =~ $re ]]; then
            echo "semantic-release planned '$version', which is not X.Y.Z" >&2
            exit 1
          fi
          # A major version is the maintainer's decision (spec R3), never an accident: without the tag v0.0.0 semantic-release
          # plans 1.0.0 for the first release. When the maintainer decides on 1.0.0, they change this line on purpose.
          case "$version" in
            ''|0.*) ;;
            *)
              echo "planned $version: a major version is the maintainer's decision (spec R3); is the tag v0.0.0 missing?" >&2
              exit 1
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next release version: ${version:-none}"

  # Runs on every push to main, with or without a release: sha-<short> and edge always, X.Y.Z when plan found a version.
  # docker/metadata-action skips a tag whose enable is false before it reads the value, so the empty value of the no-release
  # case is never used (checked against v6.2.0, see the task 4 report).
  images:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: remedy-server, file: Dockerfile}
          - {name: remedy-runner, file: Dockerfile.runner}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/jaydee94/${{ matrix.name }}
          # No mutable "latest": the chart pins the version it was released with.
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=edge,branch=main
            type=raw,value=${{ needs.plan.outputs.version }},enable=${{ needs.plan.outputs.version != '' }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max,ignore-error=true

  chart:
    needs: plan
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The Helm preinstalled on the runner; no third-party setup action.
      - name: Helm version
        run: helm version
      - name: Package
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: sh scripts/package-chart.sh "$VERSION" dist
      - name: Push to GHCR
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin
          sh scripts/push-chart.sh "dist/remedy-$VERSION.tgz" oci://ghcr.io/jaydee94/charts
      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: dist/remedy-*.tgz
          if-no-files-found: error

  publish:
    needs: [plan, images, chart]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version-file: release/.nvmrc
          cache: npm
          cache-dependency-path: release/package-lock.json
      - run: npm ci --ignore-scripts --prefix release
      # The assets glob of the github plugin (dist/remedy-*.tgz) makes a release without the chart when nothing matches.
      - name: The chart package is there
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          if [ ! -f "dist/remedy-$VERSION.tgz" ]; then
            echo "dist/remedy-$VERSION.tgz is missing: the release would have no chart attached" >&2
            ls -l dist >&2 || true
            exit 1
          fi
      # The identity of the bump commit: semantic-release would otherwise use its own default (semantic-release-bot).
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: full
          # The version that plan found and that images and chart were pushed for: semantic-release must compute the same one.
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: release/node_modules/.bin/semantic-release --extends ./release/release.config.js
      # If main moved since plan, semantic-release finds its branch behind the remote, says so and exits 0 without a release.
      # The tag is then missing and this run fails on purpose: the run of the newer push releases.
      # The remote has the tag (the repository is public, so the fetch needs no credentials).
      - name: The tag exists
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git fetch --tags --force origin
          # A tag that only exists locally (a push that failed after the tag was made) does not count: ask the remote too.
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" > /dev/null || ! git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "no tag v$VERSION: main moved during this run (semantic-release says \"behind\"); the run of the newer push releases" >&2
            exit 1
          fi
      - name: The tag matches the chart
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git show "v$VERSION:deploy/chart/Chart.yaml" > "$RUNNER_TEMP/Chart.yaml"
          sh scripts/check-release.sh "v$VERSION" "$RUNNER_TEMP/Chart.yaml"
      # The GitHub release exists, is published and has the chart. gh and jq are preinstalled on the runner.
      - name: The GitHub release has the chart
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          fail() {
            echo "$1" >&2
            echo "recovery by hand (never move or delete the tag; docs/runbook): either create the release" >&2
            echo "  gh release create v$VERSION dist/remedy-$VERSION.tgz --title v$VERSION --notes-file <the CHANGELOG.md section of $VERSION>" >&2
            echo "or finish the existing one" >&2
            echo "  gh release upload v$VERSION dist/remedy-$VERSION.tgz --clobber && gh release edit v$VERSION --draft=false" >&2
            exit 1
          }
          release=$(gh release view "v$VERSION" --json isDraft,assets) || fail "no GitHub release v$VERSION"
          printf '%s' "$release" | jq -e '.isDraft == false' > /dev/null || fail "the GitHub release v$VERSION is a draft"
          printf '%s' "$release" | jq -e --arg name "remedy-$VERSION.tgz" 'any(.assets[]; .name == $name)' > /dev/null || fail "the GitHub release v$VERSION has no asset remedy-$VERSION.tgz"
          echo "the GitHub release v$VERSION is published with remedy-$VERSION.tgz"
