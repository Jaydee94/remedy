name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make fmt vet test build-go

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
      - run: make chart-check
      - name: Chart version equals appVersion
        run: |
          sh scripts/check-release.sh "v$(sed -n 's/^version: *//p' deploy/chart/Chart.yaml)"

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make shell-test

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: release/.nvmrc
          cache: npm
          cache-dependency-path: release/package-lock.json
      - name: Show the Helm version
        run: helm version
      - run: make release-test
        env:
          REMEDY_REQUIRE_DOCKER: "1"
